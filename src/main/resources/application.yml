spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${DB_USER:servicedesk}
    password: ${DB_PASSWORD:servicedesk}
  jpa:
    hibernate.ddl-auto: update   # use Flyway/Liquibase migrations for production
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expiry-ms: 86400000
  sla:
    check-interval-ms: ${SLA_CHECK_INTERVAL_MS:60000}
  admin:
    email: ${ADMIN_EMAIL:admin@servicedesk.local}
    password: ${ADMIN_PASSWORD:admin12345}
